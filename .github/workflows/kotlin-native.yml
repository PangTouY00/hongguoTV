name: Verify Kotlin standalone APK
# 分支推送只出可安装的调试包；正式包与正式 Release 由 release-tv.yml 在 kotlin-v* 标签上构建。
on:
  push:
    branches: [main, 'android6-support', 'android44-support', 'feature-*', 'fix-*']
  pull_request:
    branches: [main]
    paths: ['kotlin-tv/**', 'scripts/build-kotlin.sh', '.github/workflows/kotlin-native.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 20
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # ~/.m2 存的是 Robolectric 拉取的 android-all 镜像；不缓存它，每次跑 :app:testDebugUnitTest 都要重新下载一遍。
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
            ~/.m2
          key: ${{ runner.os }}-gradle-${{ hashFiles('kotlin-tv/gradle/wrapper/gradle-wrapper.properties', 'kotlin-tv/gradle.properties', 'kotlin-tv/**/*.gradle.kts', 'kotlin-tv/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Cache the shared signing key
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.android
          key: hongguotv-signing-key-v2
      - name: Prepare the one signing key every build uses
        run: |
          set -euo pipefail
          # 密钥必须写在被缓存的目录里，并让构建工具确实去这个目录取，否则每次构建都换一把签名。
          export ANDROID_USER_HOME="$HOME/.android"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_USER_HOME"
          if [ ! -f "$ANDROID_USER_HOME/debug.keystore" ]; then
            echo "No cached signing key was restored; generating one that later builds will reuse."
            "$JAVA_HOME/bin/keytool" -genkeypair -storetype JKS -keystore "$ANDROID_USER_HOME/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l "$ANDROID_USER_HOME/debug.keystore"
      - name: Installable development APK
        run: ./kotlin-tv/gradlew -p kotlin-tv :app:assembleDebug --console=plain
      - name: Name the development APK after this build
        env:
          BUILD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -eu
          apk_dir=kotlin-tv/app/build/outputs/apk/debug
          safe_ref="$(printf '%s' "$BUILD_REF" | tr -c 'A-Za-z0-9._-' '-')"
          for apk in "$apk_dir"/*.apk; do
            [ -e "$apk" ] || continue
            mv "$apk" "$apk_dir/hongguotv-debug-${safe_ref}-$(git rev-parse --short HEAD).apk"
          done
          ls -l "$apk_dir"
      - name: Unit tests and Android lint
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Publish this APK as a pre-release
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ github.head_ref || github.ref_name }}
          JOB_OUTCOME: ${{ job.status }}
        run: |
          set -eu
          apk_dir=kotlin-tv/app/build/outputs/apk/debug
          apk="$(ls "$apk_dir"/*.apk 2>/dev/null | head -n1 || true)"
          if [ -z "$apk" ]; then echo "No APK was produced; nothing to publish."; exit 0; fi
          safe_ref="$(printf '%s' "$BUILD_REF" | tr -c 'A-Za-z0-9._-' '-')"
          short="$(git rev-parse --short HEAD)"
          tag="build-${safe_ref}-${short}"
          version="$(sed -n '/versionName/p' kotlin-tv/app/build.gradle.kts | grep -oE '"[^"]*"' | tail -n1 | tr -d '"')"
          code="$(sed -n '/versionCode/p' kotlin-tv/app/build.gradle.kts | grep -oE '[0-9]+' | tail -n1)"
          from="${{ github.event.before }}"
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then from=""; fi
          heading="本次推送的改动"
          changes=""
          if [ -n "$from" ]; then changes="$(git log --no-merges --pretty=format:'- %s' "$from..HEAD" || true)"; fi
          if [ -z "$changes" ]; then heading="本分支最近提交"; changes="$(git log --no-merges -n 15 --pretty=format:'- %s')"; fi
          checks=passed
          if [ "$JOB_OUTCOME" != "success" ]; then checks=failed; fi
          notes=$(cat <<EOF
          自动构建的调试包：分支 \`${BUILD_REF}\`，提交 \`${short}\`，versionName ${version:-未知} / versionCode ${code:-未知}。

          ## ${heading}
          ${changes}

          ## 检查
          自动化检查：${checks}（\`:core:test\`、\`:app:testDebugUnitTest\`、\`:app:assembleDebug\`、\`:app:lintDebug\`）。

          ## 安装
          下载下方 APK 直接安装即可覆盖已安装的版本（与正式包共用同一把签名密钥）。这是预发布构建，未标记 Latest，不会进入 App 内的自动更新通道；正式版本由 release-tv.yml 在 \`kotlin-v*\` 标签上构建并发布。
          EOF
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --prerelease --title "调试构建 ${BUILD_REF} ${short}" --notes "$notes"
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --prerelease --title "调试构建 ${BUILD_REF} ${short}" --notes "$notes"
          fi
          gh release view "$tag" --json tagName,url,assets --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kotlin-native-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/tests/testDebugUnitTest/
            kotlin-tv/app/build/reports/lint-results-debug.*
            kotlin-tv/app/build/outputs/apk/debug/*.apk
