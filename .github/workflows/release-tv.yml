name: Build and publish TV release APK
# 推送 kotlin-v* 标签时构建正式包并发布为正式 Release（App 内的自动更新只读这里的 Latest）。
# 正式包沿用调试包那把签名密钥，已安装的设备可以直接覆盖安装并保留本机数据。
on:
  push:
    tags: ['kotlin-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-${{ hashFiles('kotlin-tv/gradle/wrapper/gradle-wrapper.properties', 'kotlin-tv/gradle.properties', 'kotlin-tv/**/*.gradle.kts', 'kotlin-tv/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Reuse the signing key the installed app already has
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.android
          key: hongguotv-debug-keystore-v1
      - name: Run the checks, then sign the release APK with that key
        run: |
          set -eu
          ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
          test -f "$HOME/.android/debug.keystore"
          export HONGGUOTV_KEYSTORE="$HOME/.android/debug.keystore"
          export HONGGUOTV_KEY_ALIAS=androiddebugkey
          export HONGGUOTV_STORE_PASSWORD=android
          export HONGGUOTV_KEY_PASSWORD=android
          ./kotlin-tv/gradlew -p kotlin-tv :app:assembleRelease --console=plain
      - name: Verify the APK identity and record the signing certificate
        id: apk
        run: |
          set -eu
          version="${GITHUB_REF_NAME#kotlin-v}"
          apk=kotlin-tv/app/build/outputs/apk/release/app-release.apk
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -n1)"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          grep -q "package: name='com.hongguotv.nativeapp'" <<<"$badging"
          grep -q "versionName='$version'" <<<"$badging"
          grep -q "sdkVersion:'23'" <<<"$badging"
          code="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$badging" | head -n1)"
          fingerprint="$("$build_tools/apksigner" verify --print-certs "$apk" | sed -n 's/^SHA-256 digest: //p' | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "APK versionName $version / versionCode $code, signing SHA-256 $fingerprint"
      - name: Write the release notes
        id: notes
        env:
          VERSION: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
          FINGERPRINT: ${{ steps.apk.outputs.fingerprint }}
        run: |
          set -eu
          previous="$(git tag -l 'kotlin-v*' --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n1 || true)"
          if [ -n "$previous" ]; then
            heading="自 $previous 以来的改动"
            changes="$(git log --no-merges --pretty=format:'- %s' "$previous..HEAD")"
          else
            heading="本次发布的改动"
            changes="$(git log --no-merges -n 25 --pretty=format:'- %s')"
          fi
          cat > notes.md <<EOF
          红果 TV ${VERSION} 正式版（versionCode ${CODE}），支持 Android 6.0 及以上。

          ## ${heading}
          ${changes}

          ## 检查
          GitHub Actions 已运行 \`:core:test\`、\`:app:testDebugUnitTest\`、\`:app:lintDebug\`、\`:app:assembleDebug\`、\`:app:assembleRelease\`，全部通过后才发布本包。

          ## 签名与安装
          本包沿用与调试包相同的签名密钥（SHA-256 指纹 \`${FINGERPRINT}\`），已安装的设备可直接覆盖安装并保留本机收藏、历史与播放位置。下载 \`hongguotv-kotlin-${VERSION}-android6.apk\` 安装即可；App 内的自动更新读取本仓库的最新正式版。
          EOF
          cat notes.md
      - name: Package the APK with the updater manifest
        id: package
        env:
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          set -eu
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -n1)"
          out="$(python3 scripts/prepare-kotlin-release.py --apk kotlin-tv/app/build/outputs/apk/release/app-release.apk \
            --aapt "$build_tools/aapt" --output outputs/release --tag "$GITHUB_REF_NAME" --notes-file notes.md)"
          echo "directory=$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"
      - name: Publish the formal release
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECTORY: ${{ steps.package.outputs.directory }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" "$DIRECTORY"/*.apk "$DIRECTORY"/update.json "$DIRECTORY"/release-notes.md \
            --title "红果 TV $VERSION" --notes-file notes.md
          gh release view "$GITHUB_REF_NAME" --json tagName,name,prerelease,draft,assets \
            --jq '{tag:.tagName,title:.name,prerelease:.prerelease,draft:.draft,assets:[.assets[].name]}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tv-release-package
          path: |
            outputs/release/
            kotlin-tv/app/build/reports/
