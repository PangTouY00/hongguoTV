name: Build and publish TV release APK
# 推送 kotlin-v* 标签时构建正式包并发布为正式 Release（App 内的自动更新只读这里的 Latest）。
# 同一个版本发两个构建：Android 6.0+（main）与 Android 4.4（android44-support），
# versionName / versionCode 必须一致；update.json 用 variants 让两类设备各取各的包。
on:
  push:
    tags: ['kotlin-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 kotlin-v 标签（用于中断后继续同一版本）
        required: true
        default: kotlin-v0.1.12
      variant:
        description: '发布哪些构建：both（Android 6.0+ 与 4.4）或 android6（只发 Android 6.0+）'
        required: false
        default: both
permissions:
  contents: write
jobs:
  android6:
    name: Android 6.0+ 构建
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.apk.outputs.version }}
      code: ${{ steps.apk.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # ~/.m2 存的是 Robolectric 拉取的 android-all 镜像；不缓存它，每次跑 :app:testDebugUnitTest 都要重新下载一遍。
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
            ~/.m2
          key: ${{ runner.os }}-gradle-${{ hashFiles('kotlin-tv/gradle/wrapper/gradle-wrapper.properties', 'kotlin-tv/gradle.properties', 'kotlin-tv/**/*.gradle.kts', 'kotlin-tv/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Cache the shared signing key
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.android
          key: hongguotv-signing-key-v2
      - name: Prepare the one signing key every build uses
        run: |
          set -euo pipefail
          # 密钥必须写在被缓存的目录里，并让构建工具确实去这个目录取，否则每次构建都换一把签名。
          export ANDROID_USER_HOME="$HOME/.android"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_USER_HOME"
          if [ ! -f "$ANDROID_USER_HOME/debug.keystore" ]; then
            echo "No cached signing key was restored; generating one that later builds will reuse."
            "$JAVA_HOME/bin/keytool" -genkeypair -storetype JKS -keystore "$ANDROID_USER_HOME/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l "$ANDROID_USER_HOME/debug.keystore"
      - name: Run the checks and build the debug APK
        id: build
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in kotlin-v[0-9]*) ;; *) echo "Unsupported release tag: $tag"; exit 1;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain 2>&1 | tee build-checks.log
      - name: Build the release APK with that key
        run: |
          set -euo pipefail
          export HONGGUOTV_KEYSTORE="$HOME/.android/debug.keystore"
          export HONGGUOTV_KEY_ALIAS=androiddebugkey
          export HONGGUOTV_STORE_PASSWORD=android
          export HONGGUOTV_KEY_PASSWORD=android
          # 同一份 lint 报告由上一步的 :app:lintDebug 产出，这里不再重复跑 release 变体。
          ./kotlin-tv/gradlew -p kotlin-tv :app:assembleRelease -x lintVitalRelease --console=plain 2>&1 | tee build-release.log
      - name: Verify the APK identity and record the signing certificate
        id: apk
        env:
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#kotlin-v}"
          apk=kotlin-tv/app/build/outputs/apk/release/app-release.apk
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -n1)"
          if [ -x "$build_tools/aapt" ]; then aapt_tool="$build_tools/aapt"; else aapt_tool="$build_tools/aapt2"; fi
          echo "aapt_tool=$aapt_tool" >> "$GITHUB_OUTPUT"
          badging="$("$aapt_tool" dump badging "$apk")"
          grep -q "package: name='com.hongguotv.nativeapp'" <<<"$badging"
          grep -q "versionName='$version'" <<<"$badging"
          grep -q "sdkVersion:'23'" <<<"$badging"
          code="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$badging" | head -n1)"
          fingerprint="$("$build_tools/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "APK versionName $version / versionCode $code, signing SHA-256 $fingerprint"
          mkdir -p artifacts
          cp "$apk" artifacts/hongguotv-kotlin-$version-android6.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-android6
          path: artifacts/hongguotv-kotlin-*-android6.apk
  android44:
    name: Android 4.4 构建
    needs: android6
    # 只发高版本（Android 6.0+）时跳过 4.4 构建；4.4 线保留在 android44-support 分支。
    if: ${{ (github.event.inputs.variant || 'both') != 'android6' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: android44-support
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
            ~/.m2
          key: ${{ runner.os }}-gradle-${{ hashFiles('kotlin-tv/gradle/wrapper/gradle-wrapper.properties', 'kotlin-tv/gradle.properties', 'kotlin-tv/**/*.gradle.kts', 'kotlin-tv/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Cache the shared signing key
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.android
          key: hongguotv-signing-key-v2
      - name: Prepare the one signing key every build uses
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$HOME/.android"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_USER_HOME"
          if [ ! -f "$ANDROID_USER_HOME/debug.keystore" ]; then
            echo "No cached signing key was restored; generating one that later builds will reuse."
            "$JAVA_HOME/bin/keytool" -genkeypair -storetype JKS -keystore "$ANDROID_USER_HOME/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l "$ANDROID_USER_HOME/debug.keystore"
      - name: Run the checks and build the Android 4.4 APK
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#kotlin-v}"
          export HONGGUOTV_VERSION_NAME="$version"
          export HONGGUOTV_KEYSTORE="$HOME/.android/debug.keystore"
          export HONGGUOTV_KEY_ALIAS=androiddebugkey
          export HONGGUOTV_STORE_PASSWORD=android
          export HONGGUOTV_KEY_PASSWORD=android
          ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain 2>&1 | tee build-checks.log
      - name: Verify the APK identity and record the signing certificate
        id: apk
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#kotlin-v}"
          apk=kotlin-tv/app/build/outputs/apk/release/app-release.apk
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -n1)"
          if [ -x "$build_tools/aapt" ]; then aapt_tool="$build_tools/aapt"; else aapt_tool="$build_tools/aapt2"; fi
          badging="$("$aapt_tool" dump badging "$apk")"
          grep -q "package: name='com.hongguotv.nativeapp'" <<<"$badging"
          grep -q "versionName='$version'" <<<"$badging"
          grep -q "sdkVersion:'19'" <<<"$badging"
          code="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$badging" | head -n1)"
          fingerprint="$("$build_tools/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Android 4.4 APK versionName $version / versionCode $code, signing SHA-256 $fingerprint"
          mkdir -p artifacts
          cp "$apk" artifacts/hongguotv-kotlin-$version-android44.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-android44
          path: artifacts/hongguotv-kotlin-*-android44.apk
  publish:
    name: 发布正式版
    needs: [android6, android44]
    # android44 被跳过时 needs 里那一项是 skipped，必须用 always() 才能继续发布。
    if: ${{ always() && needs.android6.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: apk-android*
          path: artifacts
          merge-multiple: true
      - name: Write the release notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#kotlin-v}"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          # 仓库里带手写发布说明时优先用它：正式版的更新日志要写清改了什么、为什么、怎么安装验证。
          if [ -f "release-notes/${tag}.md" ]; then
            cp "release-notes/${tag}.md" notes.md
          else
            previous="$(git tag -l 'kotlin-v*' --sort=-creatordate | grep -v "^${tag}$" | head -n1 || true)"
            if [ -n "$previous" ]; then
              heading="自 $previous 以来的改动"
              changes="$(git log --no-merges --pretty=format:'- %s' "$previous..HEAD")"
            else
              heading="本次发布的改动"
              changes="$(git log --no-merges -n 25 --pretty=format:'- %s')"
            fi
            {
              printf '%s\n' "红果 TV ${version} 正式版（versionCode 见下方清单）。"
              printf '\n## %s\n%s\n' "$heading" "$changes"
              printf '\n## 检查\nGitHub Actions 已运行 :core:test、:app:testDebugUnitTest、:app:lintDebug、:app:assembleDebug、:app:assembleRelease，全部通过后才发布本包。\n'
            } > notes.md
          fi
          # App 内的更新弹窗只显示 update.json 里的 notes，上限 1500 字（与 AppUpdates 的 take(1500) 一致）。
          if [ -f "release-notes/${tag}.update.md" ]; then
            python3 scripts/shorten-release-notes.py --notes-file "release-notes/${tag}.update.md" --output update-notes.md
          else
            python3 scripts/shorten-release-notes.py --notes-file notes.md --output update-notes.md
          fi
          cat notes.md
      - name: Package the APKs with the updater manifest
        id: package
        env:
          RELEASE_TAG: ${{ steps.notes.outputs.tag }}
        run: |
          set -euo pipefail
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -n1)"
          if [ -x "$build_tools/aapt" ]; then aapt_tool="$build_tools/aapt"; else aapt_tool="$build_tools/aapt2"; fi
          android6="$(ls artifacts/*-android6.apk)"
          variant_args=""
          if ls artifacts/*-android44.apk >/dev/null 2>&1; then
            variant_args="--variant-apk $(ls artifacts/*-android44.apk)"
          else
            echo "只发布 Android 6.0+ 构建，本次不带 4.4 变体。"
          fi
          # shellcheck disable=SC2086
          out="$(python3 scripts/prepare-kotlin-release.py --apk "$android6" $variant_args \
            --aapt "$aapt_tool" --output outputs/release --tag "$RELEASE_TAG" \
            --update-notes-file update-notes.md --notes-file notes.md)"
          echo "directory=$out" >> "$GITHUB_OUTPUT"
          # 两个构建必须同为这一版的 versionName / versionCode，否则 App 内更新会选错包。
          python3 - "$out" <<'PY'
          import json, sys
          from pathlib import Path
          manifest = json.loads((Path(sys.argv[1]) / "update.json").read_text(encoding="utf-8"))
          variants = manifest.get("variants", [])
          if variants:
              assert len(variants) == 2, manifest
              assert {v["minSdk"] for v in variants} == {19, 23}, manifest
          else:
              assert manifest["minSdk"] == 23, manifest
          print("update.json:", json.dumps({k: manifest[k] for k in ("versionCode", "versionName", "minSdk")},
                                           ensure_ascii=False), "variants:", [v["minSdk"] for v in variants])
          PY
          ls -l "$out"
      - name: Verify both APKs share one signing certificate
        run: |
          set -euo pipefail
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -n1)"
          for apk in outputs/release/*/*.apk; do
            echo "$apk: $("$build_tools/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)"
          done
          fingerprints="$("$build_tools/apksigner" verify --print-certs outputs/release/*/*.apk | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u | wc -l)"
          [ "$fingerprints" -eq 1 ] || { echo "同一次发布的多个构建签名不一致"; exit 1; }
      - name: Publish the formal release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.notes.outputs.tag }}
          DIRECTORY: ${{ steps.package.outputs.directory }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$DIRECTORY"/*.apk "$DIRECTORY"/update.json "$DIRECTORY"/release-notes.md \
            --title "红果 TV $VERSION" --notes-file notes.md
          gh release view "$RELEASE_TAG" --json tagName,name,isPrerelease,isDraft,assets \
            --jq '{tag:.tagName,title:.name,prerelease:.isPrerelease,draft:.isDraft,assets:[.assets[].name]}'
